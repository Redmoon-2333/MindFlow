[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindflow"
version = "2.0.0-alpha"
description = "Local-first intelligent focus assistant"
requires-python = ">=3.11"
authors = [
    {name = "RedMoon"},
]
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "platformdirs>=4.0",
    "uuid6>=2024.0.0",
    "httpx>=0.27",
    "langchain-core>=1.5,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "xgboost>=2.0",
    "shap>=0.44",
]
ml = [
    "hmmlearn>=0.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pandas>=2.0",
    "xgboost>=2.0",
    "shap>=0.44",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# ML naming: X/y matrix conventions (N803 args, N806 locals). The former
# single-file train/models.py is now the train/models/ package.
"src/mindflow/train/models/*.py" = ["N803", "N806"]
"src/mindflow/train/pipeline.py" = ["N806"]
"src/mindflow/train/features.py" = ["N806"]
"src/mindflow/train/explain.py" = ["N803", "N806"]
"tests/test_explain.py" = ["N802", "N803", "N806"]
# E501: Chinese text in system prompts, eval output formatting, and
# test fixtures naturally exceeds 100 chars
"src/mindflow/agents/experts.py" = ["E501"]
"src/mindflow/eval/__main__.py" = ["E501"]
"src/mindflow/eval/adapters.py" = ["E501"]
"tests/test_agents_types.py" = ["E501"]
"tests/test_agents_orchestrator.py" = ["E501"]
"tests/test_eval_adapters.py" = ["E501"]
"tests/test_eval_runner.py" = ["E501"]
"tests/test_eval_scenarios.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
disallow_any_unimported = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "uuid6",
    "loguru",
    "psutil",
    "win32gui",
    "win32process",
    "Xlib",
    "Xlib.*",
    "AppKit",
    "Quartz",
    "winrt.*",
    "plyer",
    "pystray",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib",
    "hmmlearn",
    "hmmlearn.*",
    "pandas",
    "shap",
    "xgboost",
    "xgboost.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
